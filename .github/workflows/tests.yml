name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Parsing and device selection need none of transformers, datasets or
      # streamlit, and the tests are written so they do not import them.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install tree-sitter tree-sitter-python pyyaml pytest

      - run: pytest -q
